name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt reports unformatted files:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-build all release targets
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            sh build.sh "$target"
          done
      - name: Check Linux assets are statically linked
        run: |
          for asset in dist/agent-links-linux-arm64 dist/agent-links-linux-x64; do
            file "$asset"
            file "$asset" | grep -q 'statically linked'
          done

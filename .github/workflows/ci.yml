name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module checksums
        if: runner.os == 'Linux'
        run: go mod verify
      - name: Check module tidiness
        if: runner.os == 'Linux'
        run: go mod tidy -diff
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt reports unformatted files:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - run: go vet ./...
      # Coverage reporting runs on Linux only; macOS keeps the plain test run.
      - name: Run tests with coverage
        if: runner.os == 'Linux'
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - name: Upload coverage profile
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
          if-no-files-found: error
      - name: Run tests
        if: runner.os != 'Linux'
        run: go test ./...
      - name: Run tests with the race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go build ./...

  cross-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-build all release targets
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            sh build.sh "$target"
          done
      - name: Generate checksums
        working-directory: dist
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            sha256sum "agent-links-$target" > "checksums-$target.txt"
          done
      - name: Verify release asset architectures
        working-directory: dist
        run: |
          # Token matching keeps this independent of the `file` implementation
          # (Apple and GNU format Mach-O headers differently).
          require_tokens() {
            asset="$1"
            shift
            description="$(file -b "$asset")"
            for token in "$@"; do
              if ! printf '%s\n' "$description" | grep -Fq "$token"; then
                printf 'error: %s: expected "%s" in file output, got: %s\n' \
                  "$asset" "$token" "$description" >&2
                exit 1
              fi
            done
            printf 'verified %s: %s\n' "$asset" "$description"
          }
          require_tokens agent-links-darwin-arm64 'Mach-O' 'arm64'
          require_tokens agent-links-darwin-x64 'Mach-O' 'x86_64'
          require_tokens agent-links-linux-arm64 'ELF' 'aarch64' 'statically linked'
          require_tokens agent-links-linux-x64 'ELF' 'x86-64' 'statically linked'
      - name: Verify checksum files
        working-directory: dist
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            sha256sum --strict -c "checksums-$target.txt"
          done

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Check shell syntax
        run: sh -n run.sh build.sh
      - name: Shellcheck
        run: shellcheck run.sh build.sh
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      # `git merge-base` needs full history and the main branch to check ancestry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          runner_version="$(sed -n 's/^version=//p' run.sh)"
          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          if ! printf '%s\n' "$tag_version" | grep -Eq "$version_pattern"; then
            printf 'error: release tag (%s) must be a semantic version like v1.2.3\n' \
              "$RELEASE_TAG" >&2
            exit 1
          fi
          if ! printf '%s\n' "$runner_version" | grep -Eq "$version_pattern"; then
            printf 'error: runner version (%s) must be a semantic version like 1.2.3\n' \
              "$runner_version" >&2
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v$runner_version" ]; then
            printf 'error: release tag (%s) and runner version (%s) must match\n' \
              "$RELEASE_TAG" "$runner_version" >&2
            exit 1
          fi
      - name: Check release commit is on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Fetch tags too: the version-order check needs the released versions.
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            printf 'error: release tag %s points at commit %s, which is not on main\n' \
              "$RELEASE_TAG" "$tag_commit" >&2
            printf 'merge the release commit into main before tagging\n' >&2
            exit 1
          fi
      - name: Check release version is newer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          # A tag push checks out the tag itself. Exclude that tag so a new
          # release is not compared with itself; a same-version tag elsewhere
          # is a duplicate and must still be rejected.
          release_commit="$(git rev-parse --verify --quiet "${RELEASE_TAG}^{commit}" || true)"
          head_commit="$(git rev-parse HEAD)"
          exclude_tag=""
          if [ -n "$release_commit" ] && [ "$release_commit" = "$head_commit" ]; then
            exclude_tag="$RELEASE_TAG"
          fi
          tags="$(git tag --merged origin/main --list 'v[0-9]*' --sort=-v:refname)"
          if [ -n "$exclude_tag" ]; then
            tags="$(printf '%s\n' "$tags" | grep -vx "$exclude_tag" || true)"
          fi
          latest_version="$(
            printf '%s\n' "$tags" |
              sed 's/^v//' |
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1
          )"
          if [ -z "$latest_version" ]; then
            exit 0
          fi
          if [ "$tag_version" = "$latest_version" ]; then
            printf 'error: release version %s already exists\n' "$tag_version" >&2
            exit 1
          fi
          newest_version="$(printf '%s\n%s\n' "$latest_version" "$tag_version" | sort -V | tail -n 1)"
          if [ "$newest_version" != "$tag_version" ]; then
            printf 'error: release version %s must be greater than the latest release %s\n' \
              "$tag_version" "$latest_version" >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt reports unformatted files:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: go mod verify
      - run: go test ./...
      - run: go build ./...

  build:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-build release assets
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            sh build.sh "$target"
          done
      - name: Generate checksums
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            hash() { sha256sum "$1"; }
          else
            hash() { shasum -a 256 "$1"; }
          fi
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            hash "agent-links-$target" > "checksums-$target.txt"
          done
      - name: Verify release assets
        working-directory: dist
        run: |
          # Token matching keeps this independent of the `file` implementation
          # (Apple and GNU format Mach-O headers differently).
          require_tokens() {
            asset="$1"
            shift
            description="$(file -b "$asset")"
            for token in "$@"; do
              if ! printf '%s\n' "$description" | grep -Fq "$token"; then
                printf 'error: %s: expected "%s" in file output, got: %s\n' \
                  "$asset" "$token" "$description" >&2
                exit 1
              fi
            done
            printf 'verified %s: %s\n' "$asset" "$description"
          }
          require_tokens agent-links-darwin-arm64 'Mach-O' 'arm64'
          require_tokens agent-links-darwin-x64 'Mach-O' 'x86_64'
          require_tokens agent-links-linux-arm64 'ELF' 'aarch64' 'statically linked'
          require_tokens agent-links-linux-x64 'ELF' 'x86-64' 'statically linked'
          if command -v sha256sum >/dev/null 2>&1; then
            verify() { sha256sum --strict -c "$1"; }
          else
            verify() { shasum -a 256 --strict -c "$1"; }
          fi
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            checksums="checksums-$target.txt"
            if [ ! -f "$checksums" ]; then
              printf 'error: missing checksum file %s\n' "$checksums" >&2
              exit 1
            fi
            if ! verify "$checksums"; then
              printf 'error: checksum verification failed for %s\n' "$target" >&2
              exit 1
            fi
          done
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/agent-links-darwin-arm64
            dist/agent-links-darwin-x64
            dist/agent-links-linux-arm64
            dist/agent-links-linux-x64
            dist/checksums-darwin-arm64.txt
            dist/checksums-darwin-x64.txt
            dist/checksums-linux-arm64.txt
            dist/checksums-linux-x64.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/agent-links-*
            dist/checksums-*.txt

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # `gh release create --generate-notes` reads the tag and commit history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify downloaded artifacts
        working-directory: artifacts
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            checksums="checksums-$target.txt"
            if [ ! -f "$checksums" ]; then
              printf 'error: missing checksum file %s\n' "$checksums" >&2
              exit 1
            fi
            if ! sha256sum -c "$checksums"; then
              printf 'error: checksum verification failed for %s\n' "$target" >&2
              exit 1
            fi
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # A pushed tag checks out its own commit; `gh release view` reports
          # the state of any release that already exists for this tag.
          release_state="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ "$release_state" = "false" ]; then
            printf 'release %s is already published; nothing to do\n' "$RELEASE_TAG"
            exit 0
          fi
          if [ "$release_state" = "true" ]; then
            printf 'resuming draft release %s\n' "$RELEASE_TAG"
          else
            tag_version="${RELEASE_TAG#v}"
            major="${tag_version%%.*}"
            set -- --draft --title "$RELEASE_TAG" --generate-notes
            if [ "$major" -eq 0 ]; then
              set -- "$@" --prerelease
            fi
            gh release create "$RELEASE_TAG" "$@"
          fi
          set --
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            set -- "$@" "artifacts/agent-links-$target" "artifacts/checksums-$target.txt"
          done
          gh release upload "$RELEASE_TAG" "$@" --clobber
          expected_assets="$(
            for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
              printf '%s\n' "agent-links-$target" "checksums-$target.txt"
            done | sort
          )"
          remote_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          missing=''
          for asset in $expected_assets; do
            if ! printf '%s\n' "$remote_assets" | grep -Fxq "$asset"; then
              missing="$missing $asset"
            fi
          done
          unexpected=''
          for asset in $remote_assets; do
            if ! printf '%s\n' "$expected_assets" | grep -Fxq "$asset"; then
              unexpected="$unexpected $asset"
            fi
          done
          if [ -n "$missing" ]; then
            printf 'error: release %s is missing assets:%s\n' "$RELEASE_TAG" "$missing" >&2
          fi
          if [ -n "$unexpected" ]; then
            printf 'error: release %s has unexpected assets:%s\n' "$RELEASE_TAG" "$unexpected" >&2
          fi
          if [ -n "$missing$unexpected" ]; then
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false
          printf 'published release %s\n' "$RELEASE_TAG"

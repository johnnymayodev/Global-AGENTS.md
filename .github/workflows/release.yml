name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # `git merge-base` needs full history and the main branch to check ancestry.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          runner_version="$(sed -n 's/^version=//p' run.sh)"
          if [ "$RELEASE_TAG" != "v$runner_version" ]; then
            printf 'error: release tag (%s) and runner version (%s) must match\n' \
              "$RELEASE_TAG" "$runner_version" >&2
            exit 1
          fi
      - name: Check release commit is on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            printf 'error: release tag %s points at commit %s, which is not on main\n' \
              "$RELEASE_TAG" "$tag_commit" >&2
            printf 'merge the release commit into main before tagging\n' >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt reports unformatted files:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: go mod verify
      - run: go test ./...
      - run: go build ./...

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-build release assets
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            sh build.sh "$target"
          done
      - name: Generate checksums
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            hash() { sha256sum "$1"; }
          else
            hash() { shasum -a 256 "$1"; }
          fi
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            hash "agent-links-$target" > "checksums-$target.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/agent-links-*
            dist/checksums-*.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # `gh release create --generate-notes` reads the tag and commit history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${{ startsWith(github.ref_name, 'v0.') && '--prerelease' || '' }} \
            artifacts/*

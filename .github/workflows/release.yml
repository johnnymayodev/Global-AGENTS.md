name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          runner_version="$(sed -n 's/^version=//p' run.sh)"
          if [ "$RELEASE_TAG" != "v$package_version" ] || [ "$runner_version" != "$package_version" ]; then
            printf 'error: release tag (%s), package (%s), and runner (%s) versions must match\n' \
              "$RELEASE_TAG" "$package_version" "$runner_version" >&2
            exit 1
          fi

  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: bun-darwin-arm64
            platform: darwin-arm64
            asset: agent-links-darwin-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
            platform: darwin-x64
            asset: agent-links-darwin-x64
          - os: ubuntu-22.04
            target: bun-linux-x64
            platform: linux-x64
            asset: agent-links-linux-x64
          - os: ubuntu-22.04-arm
            target: bun-linux-arm64
            platform: linux-arm64
            asset: agent-links-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build standalone executable
        run: sh build-standalone.sh "${{ matrix.target }}" "dist/${{ matrix.asset }}"
      - name: Generate checksum
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "checksums-${{ matrix.platform }}.txt"
          else
            shasum -a 256 "${{ matrix.asset }}" > "checksums-${{ matrix.platform }}.txt"
          fi
        working-directory: dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/checksums-${{ matrix.platform }}.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${{ startsWith(github.ref_name, 'v0.') && '--prerelease' || '' }} \
            artifacts/*
